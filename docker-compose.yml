name: ziyatbek-dinmukhamed-student-api
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ziyatbek-dinmukhamed-student-api:v1.0-ziyatbek-dinmukhamed
    container_name: ziyatbek-dinmukhamed-app
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studentsdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-studentsuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-studentspass}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ziyatbek-student-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ziyatbek-dinmukhamed-db
    environment:
      POSTGRES_DB: studentsdb
      POSTGRES_USER: ${POSTGRES_USER:-studentsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studentspass}
    volumes:
      - ziyatbek_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ziyatbek-student-network
    restart: unless-stopped

volumes:
  ziyatbek_postgres_data:
    name: ziyatbek-dinmukhamed-postgres-data

networks:
  ziyatbek-student-network:
    name: ziyatbek-dinmukhamed-network
    driver: bridge
