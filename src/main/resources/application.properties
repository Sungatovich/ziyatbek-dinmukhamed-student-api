spring.application.name=ziyatbek-dinmukhamed-student-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:studentsuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:studentspass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
